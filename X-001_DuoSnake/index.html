<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DuoSnake 🐍🐍 | 2-Player Co-op & Versus</title>
    <link data-trunk rel="rust" data-bin="DuoSnake" />
    <style>
        :root {
            --col-bg: #fff9ec;
            --col-frame: #d9bc85;
            --col-frame-dark: #c1a068;
            --col-tile-a: #f6e7c1;
            --col-tile-b: #efdcb0;
            --col-ink: #4a3b2a;
            --col-p1: #5fd07c;
            --col-p1-dark: #2e7d4f;
            --col-p2: #7bb8f5;
            --col-p2-dark: #2a6bb0;
            --col-pink: #ff9eb5;
            --font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--col-bg);
            color: var(--col-ink);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation / Branding Bar */
        header {
            height: 52px;
            background-color: #fffdf8;
            border-bottom: 3px solid var(--col-frame);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--col-ink);
            letter-spacing: 0.5px;
        }

        .badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .badge-bevy {
            background-color: rgba(95, 208, 124, 0.25);
            color: var(--col-p1-dark);
            border: 1.5px solid var(--col-p1);
        }

        .badge-wasm {
            background-color: rgba(123, 184, 245, 0.25);
            color: var(--col-p2-dark);
            border: 1.5px solid var(--col-p2);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: #fff;
            border: 2px solid var(--col-frame);
            color: var(--col-ink);
            padding: 6px 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: var(--col-tile-a);
            border-color: var(--col-frame-dark);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* Main Game Layout Container */
        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--col-bg);
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas#bevy {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* Loading Screen Overlay */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--col-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner-box {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .candy-spinner {
            width: 64px;
            height: 64px;
            border: 6px solid var(--col-tile-b);
            border-top: 6px solid var(--col-p1);
            border-right: 6px solid var(--col-pink);
            border-bottom: 6px solid var(--col-p2);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--col-ink);
        }

        .loading-subtitle {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(74, 59, 42, 0.7);
        }

        /* Bottom Controls Helper Bar */
        footer {
            height: 48px;
            background-color: #fffdf8;
            border-top: 3px solid var(--col-frame);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            flex-shrink: 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--col-ink);
            z-index: 10;
        }

        .control-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .pill-p1 {
            background-color: rgba(95, 208, 124, 0.22);
            border: 1.5px solid var(--col-p1);
            color: var(--col-p1-dark);
        }

        .pill-p2 {
            background-color: rgba(123, 184, 245, 0.22);
            border: 1.5px solid var(--col-p2);
            color: var(--col-p2-dark);
        }

        .pill-esc {
            background-color: rgba(255, 158, 181, 0.22);
            border: 1.5px solid var(--col-pink);
            color: #b03a56;
        }

        .key-tag {
            background: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(74, 59, 42, 0.25);
            font-family: monospace;
            font-size: 0.8rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        @media (max-width: 640px) {
            header {
                height: 44px;
                padding: 0 12px;
            }
            .brand {
                font-size: 1rem;
            }
            .badges {
                display: none;
            }
            footer {
                height: auto;
                padding: 6px 8px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .control-pill {
                font-size: 0.75rem;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span>🐍 DuoSnake</span>
            <div class="badges">
                <span class="badge badge-bevy">Bevy 0.14</span>
                <span class="badge badge-wasm">WebAssembly</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="btn-fullscreen" class="btn-action" title="Toggle Fullscreen">
                ⛶ Fullscreen
            </button>
        </div>
    </header>

    <main>
        <div id="game-container">
            <div id="loading-overlay">
                <div class="spinner-box">
                    <div class="candy-spinner"></div>
                </div>
                <div class="loading-title">DuoSnake is Loading...</div>
                <div class="loading-subtitle">Baking candy pixel textures & launching WASM Engine</div>
            </div>
            <canvas id="bevy"></canvas>
        </div>
    </main>

    <footer>
        <div class="control-pill pill-p2">
            <span>Player 2:</span>
            <span class="key-tag">W</span>
            <span class="key-tag">A</span>
            <span class="key-tag">S</span>
            <span class="key-tag">D</span>
        </div>
        <div class="control-pill pill-esc">
            <span>Pause / Settings:</span>
            <span class="key-tag">ESC</span>
        </div>
        <div class="control-pill pill-p1">
            <span>Player 1:</span>
            <span class="key-tag">▲</span>
            <span class="key-tag">◄</span>
            <span class="key-tag">▼</span>
            <span class="key-tag">►</span>
        </div>
    </footer>

    <script>
        // Auto-hide loading overlay when Bevy initializes canvas rendering
        const canvas = document.getElementById('bevy');
        const overlay = document.getElementById('loading-overlay');

        // Check if canvas has started rendering
        let hasLoaded = false;
        function checkCanvasLoaded() {
            if (hasLoaded) return;
            // WebGL / WebGPU context attached or size updated
            if (canvas && (canvas.width > 100 || canvas.getContext('webgl2') || canvas.getContext('webgl'))) {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    hasLoaded = true;
                }, 400);
            } else {
                requestAnimationFrame(checkCanvasLoaded);
            }
        }
        requestAnimationFrame(checkCanvasLoaded);

        // Fallback hide after 5 seconds
        setTimeout(() => {
            if (!hasLoaded) {
                overlay.classList.add('hidden');
                hasLoaded = true;
            }
        }, 5000);

        // Focus canvas on click
        window.addEventListener('click', () => {
            canvas.focus();
        });

        // Fullscreen toggle
        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', () => {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
                btnFullscreen.textContent = '✕ Exit Fullscreen';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                btnFullscreen.textContent = '⛶ Fullscreen';
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btnFullscreen.textContent = '⛶ Fullscreen';
            }
        });
    </script>
</body>
</html>
