[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/render",
    "crates/combat",
    "crates/inventory",
    "crates/meta",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Soulforge Dev Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.14", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

# Internal workspace crates
soulforge_core = { path = "crates/core" }
soulforge_data = { path = "crates/data" }
soulforge_render = { path = "crates/render" }
soulforge_combat = { path = "crates/combat" }
soulforge_inventory = { path = "crates/inventory" }
soulforge_meta = { path = "crates/meta" }
